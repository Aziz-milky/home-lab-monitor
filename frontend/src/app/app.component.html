<div class="shell">
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-icon"><span class="mi">dns</span></div>
      <div class="sb-brand-text">
        <div class="sb-brand-name">Sentinel</div>
        <div class="sb-brand-sub">homelab ops</div>
      </div>
    </div>

    <nav>
      <div class="nav-sect">MONITORING</div>
      <a routerLink="/" routerLinkActive="nav-active" [routerLinkActiveOptions]="{exact:true}">
        <span class="mi">dashboard</span> Overview
      </a>
      <a routerLink="/hosts" routerLinkActive="nav-active">
        <span class="mi">dns</span> Hosts
      </a>
      <a routerLink="/topology" routerLinkActive="nav-active">
        <span class="mi">hub</span> Topology
      </a>
      <a routerLink="/logs" routerLinkActive="nav-active">
        <span class="mi">list_alt</span> Logs
      </a>
      <a routerLink="/containers" routerLinkActive="nav-active">
        <span class="mi">view_in_ar</span> Containers
      </a>

      <div class="nav-sect">CONFIGURATION</div>
      <a routerLink="/services" routerLinkActive="nav-active">
        <span class="mi">settings</span> Services
      </a>
      <a routerLink="/alerts" routerLinkActive="nav-active">
        <span class="mi">notifications</span> Alerts
      </a>
      <a routerLink="/alert-rules" routerLinkActive="nav-active">
        <span class="mi">rule</span> Alert Rules
      </a>
      <a routerLink="/diagnostics" routerLinkActive="nav-active">
        <span class="mi">insights</span> Metrics
      </a>
    </nav>

    <div class="sb-status">
      <span class="live-dot"></span>
      <div>
        <div class="status-title">Collector online</div>
        <div class="status-sub">polling every 5s</div>
      </div>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div class="breadcrumbs">Overview</div>
      <div class="topbar-search">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>
        </svg>
        <input placeholder="Search…" />
        <span class="kb-badge">/#</span>
      </div>
      <div class="live-indicator">
        <span class="live-dot-sm"></span> live
      </div>
    </header>

    <main class="scroll-area">
      <router-outlet />
    </main>
  </div>
</div>
