<mat-toolbar color="primary">
  <button mat-icon-button (click)="drawer.toggle()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>{{ title }}</span>

  <span style="flex:1"></span>

  <div class="topbar-right">
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/>
      </svg>
      <input placeholder="Search services…" class="search-input" #searchInput (keyup.enter)="searchService(searchInput.value)" />
    </div>
    <button class="refresh-btn" (click)="refresh()" title="Refresh">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v5h-5"/>
      </svg>
    </button>
    <div class="avatar">JR</div>
  </div>
</mat-toolbar>

<mat-drawer-container>
  <mat-drawer #drawer mode="over" opened>
    <div class="sidebar-brand">
      <div class="brand-icon">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/><circle cx="7" cy="7" r="0.5"/><circle cx="7" cy="17" r="0.5"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">Sentinel</div>
        <div class="brand-sub">homelab ops</div>
      </div>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="/" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" (click)="drawer.close()">
        <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>
        </svg>
        <span matListItemTitle>Overview</span>
      </a>
      <a mat-list-item routerLink="/services" routerLinkActive="active-link" (click)="drawer.close()">
        <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>
        </svg>
        <span matListItemTitle>Services</span>
      </a>
      <a mat-list-item routerLink="/alerts" routerLinkActive="active-link" (click)="drawer.close()">
        <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
        <span matListItemTitle>Alerts</span>
      </a>
      <a mat-list-item routerLink="/alert-rules" routerLinkActive="active-link" (click)="drawer.close()">
        <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/>
        </svg>
        <span matListItemTitle>Alert Rules</span>
      </a>
      <a mat-list-item routerLink="/diagnostics" routerLinkActive="active-link" (click)="drawer.close()">
        <svg class="nav-icon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 3v18h18"/><path d="M7 14l3-4 3 2 4-6"/>
        </svg>
        <span matListItemTitle>Metrics</span>
      </a>
    </mat-nav-list>

    <div class="sidebar-status">
      <span class="status-dot"></span>
      <div class="status-text">
        <div class="status-title">Collector online</div>
        <div class="status-sub">polling every 15s</div>
      </div>
    </div>
  </mat-drawer>

  <mat-drawer-content>
    <div class="content">
      <router-outlet />
    </div>
  </mat-drawer-content>
</mat-drawer-container>
